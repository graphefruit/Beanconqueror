apply plugin: 'com.android.application'

android {
    namespace = "com.beanconqueror"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.beanconqueror.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 80802
        versionName "8.8.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        // Only for the device measurements (DEVELOPING.md, "Device tests"; `./gradlew assembleMeasure`):
        // the release build with R8, signed with the debug key and with WebView debugging switched
        // on through its own copy of capacitor.config.json (see below). Never published.
        measure {
            initWith release
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
    }
}

/**
 * Writes capacitor.config.json of the measure build: the synced config plus
 * `android.webContentsDebuggingEnabled`, so the test can reach the WebView over DevTools. The file
 * overrides the synced one only in the measure build; debug and release keep it as it is.
 */
abstract class MeasureCapacitorConfig extends DefaultTask {
    @InputFile
    abstract RegularFileProperty getSyncedConfig()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @TaskAction
    void write() {
        def config = new groovy.json.JsonSlurper().parse(syncedConfig.get().asFile)
        config.android = (config.android ?: [:]) + [webContentsDebuggingEnabled: true]
        outputDir.get().file('capacitor.config.json').asFile.text =
            groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(config))
    }
}

def measureCapacitorConfig = tasks.register('measureCapacitorConfig', MeasureCapacitorConfig) {
    syncedConfig = file('src/main/assets/capacitor.config.json')
}

androidComponents {
    onVariants(selector().withBuildType('measure')) { variant ->
        variant.sources.assets.addGeneratedSourceDirectory(measureCapacitorConfig, { it.outputDir })
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    // Custom dependencies for custom native code
    implementation "androidx.documentfile:documentfile:1.1.0"

    // Default config from Capacitor
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Only to call org.apache.cordova.LOG; the plugins module ships it at runtime.
    compileOnly "org.apache.cordova:framework:$cordovaAndroidVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
