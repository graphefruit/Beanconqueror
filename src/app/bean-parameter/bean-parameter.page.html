<ion-header>
  <app-header [title]="'NAV_BEAN_PARAMS' | translate">
    <ion-back-button header-slot="start" icon="beanconqueror-back" [attr.aria-label]="'BACK' | translate" defaultHref="/home/profile" />
  </app-header>
</ion-header>
<ion-content>
  <ion-card class="ion-padding">
    <div class="card-title-text">{{"BEAN_PARAMETER_CUSTOMIZE_TITLE" | translate}}</div>
    <ion-card-content class="ion-no-padding">
      {{"BEAN_PARAMETER_CUSTOMIZE_DESCRIPTION" | translate}}
    </ion-card-content>
  </ion-card>
  <ion-card button (click)="openManageParameters()" tappable>
    <ion-item class="ion-padding-horizontal" lines="none">
      <ion-icon aria-hidden="true" name="beanconqueror-manage-parameter" slot="start" />
      {{"NAV_MANAGE_PARAMETERS" | translate}}
    </ion-item>
  </ion-card>
  <ion-card button (click)="openListViewParameters()" tappable>
    <ion-item class="ion-padding-horizontal" lines="none">
      <ion-icon aria-hidden="true" name="beanconqueror-list-view-parameter" slot="start" />
      {{"NAV_LIST_VIEW_CUSTOM_PARAMETERS" | translate}}
    </ion-item>
  </ion-card>


</ion-content>
