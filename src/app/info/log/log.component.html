<ion-header>
  <app-header [title]="'NAV_LOGS' | translate">
    <ion-back-button header-slot="start" icon="beanconqueror-back" [attr.aria-label]="'BACK' | translate" defaultHref="/home/profile/info" />
    <app-header-button header-slot="end" icon="send-outline" buttonClass="big-icon-only" [ariaLabel]="'SEND_LOGS' | translate" (clicked)="send()" />
  </app-header>
</ion-header>
<ion-content>
  <ion-card class="ion-padding">
    <ol>
      @for (line of lines(); track $index) {
        <li [style.color]="line.color">{{ line.text }}</li>
      }
    </ol>
    @if (hasEarlier()) {
      <ion-button expand="block" fill="outline" (click)="showEarlier()">{{ 'LOG_SHOW_EARLIER' | translate }}</ion-button>
    }
  </ion-card>
</ion-content>
