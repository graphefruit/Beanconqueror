<ion-header>
  <app-header [title]="'NAV_FROZEN_BEANS_LIST' | translate">
    <app-header-dismiss-button header-slot="start" (dismissed)="dismiss()" />
  </app-header>
</ion-header>
<ion-content>
  <app-virtual-list [items]="frozenBeansList" [itemKey]="beanKey" [estimateSize]="180" [clearOfAddButton]="false">
    <ng-template [appVirtualRow]="frozenBeansList" let-bean>
      <bean-information [disabled]='true' [showActions]='false' [bean]="bean" />
    </ng-template>
  </app-virtual-list>
</ion-content>
