<ion-header>
  <app-header [title]="'BEAN_LIST' | translate">
    <app-header-dismiss-button header-slot="start" (dismissed)="dismiss()" />
  </app-header>
</ion-header>
<ion-content>
  <app-virtual-list [items]="beansList" [itemKey]="beanKey" [estimateSize]="210" [clearOfAddButton]="false">
    <ng-template [appVirtualRow]="beansList" let-bean>
      <bean-information [disabled]='true' [showActions]='false' [bean]="bean" />
    </ng-template>
  </app-virtual-list>
</ion-content>
