<ng-template #close>
  <ion-button class="close" (click)="dismiss()" [attr.aria-label]="'CLOSE' | translate" fill="clear">
    <ion-icon aria-hidden="true" name="close-outline" slot="icon-only" />
  </ion-button>
</ng-template>
<ion-content [scrollY]="false">
  @if (loading()) {
    <div class="loading">
      <ion-spinner name="dots" />
      <ng-container *ngTemplateOutlet="close" />
    </div>
  } @else {
    <div class="detail">
      <app-brew-graph-view [flow]="flow()" [reference]="reference()" [timeSlider]="true">
        <ng-container *ngTemplateOutlet="close" />
      </app-brew-graph-view>
      @if (referenceMissing()) {
        <p class="hint">{{ 'GRAPH_REFERENCE_CANNOT_BE_SHOWN' | translate }}</p>
      }
    </div>
  }
</ion-content>
