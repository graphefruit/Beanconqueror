<ion-header>
  <app-header [title]="'IMPORT_SHOT_FROM_METICULOUS' | translate">
    <app-header-dismiss-button header-slot="start" (dismissed)="dismiss()" />
  </app-header>
</ion-header>
<ion-content>
  <ion-radio-group [(ngModel)]="radioSelection">
    <ion-card>
      <app-virtual-list [items]="history" [itemKey]="entryKey" [estimateSize]="240" [clearOfAddButton]="false" (endReached)="loadMoreHistory()">
        <ng-template [appVirtualRow]="history" let-entry>
          <ion-item tappable lines='full'>
            <ion-radio justify="start" label-placement="end" value='{{entry.id}}'>
              <ion-grid class="no-ion-col-vertical-padding limit-grid-overflow">
              <h2>{{entry.profile.name}}</h2>
              <div class='font-size-16'>{{this.uiHelper.formatTimeNumber(entry.time * 1000)}}</div>
              </ion-grid>
              <graph-display-card [meticulousHistoryData]='entry' [meticulousDevice]='meticulousDevice' />
            </ion-radio>
          </ion-item>
        </ng-template>
      </app-virtual-list>
    </ion-card>


  </ion-radio-group>
</ion-content>
<ion-footer class="ion-no-border">
  <ion-row>
    <ion-col size="6">
      <ion-button (click)="dismiss()" color="danger" expand="block" fill="outline"
                  tappable>{{"CANCEL" | translate}}</ion-button>
    </ion-col>
    <ion-col size="6">
      <ion-button (click)="choose()" [disabled]='!radioSelection' color="accent" expand="block" tappable
                  type="submit">{{"CHOOSE" | translate}}</ion-button>
    </ion-col>
  </ion-row>
</ion-footer>
