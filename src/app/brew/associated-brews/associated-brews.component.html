<ion-header>
  <app-header [title]="'NAV_BREWS' | translate">
    <app-header-dismiss-button header-slot="start" (dismissed)="dismiss()" />
  </app-header>
</ion-header>
<ion-content>
    @if(associatedBrews?.length > 0) {
      <app-virtual-list [items]="associatedBrews" [itemKey]="brewKey" [estimateSize]="180" [clearOfAddButton]="false">
        <ng-template [appVirtualRow]="associatedBrews" let-brew>
          <brew-information [collapsed]="isCollapsed" (brewAction)="brewAction()"
                            [brew]="brew" />
        </ng-template>
      </app-virtual-list>
    } @else {
      <div class="ion-padding ion-text-center">
        <div>
          <ion-icon aria-hidden="true" color="inactive" name="beanconqueror-cup" size="large" />
        </div>
        <div class="text-color-inactive ion-margin-top">
          {{"PAGE_BREWS_NO_ENTRIES" | translate}}
        </div>
      </div>
    }
</ion-content>
<!--Needs to be empty-->
<ion-footer />
