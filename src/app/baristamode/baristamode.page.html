<ion-content>
  <ion-tabs>

    <!-- As on Home: a navigation landmark, focusable tabs, one selection per Enter. -->
    <nav slot="bottom">
    <ion-tab-bar (keydown.enter)="$event.preventDefault()" style="box-shadow: 0px -2px 10px #00000021;padding-top: 12px;">
      <ion-tab-button tab="barista" href="/baristamode/barista" tappable>
        <ion-icon aria-hidden="true" class="menu-icon" name="water-outline" />
        <ion-label>{{"NAV_BARISTAMODE_SECTION" | translate}}</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="brews" href="/baristamode/brews" tappable>
        <ion-icon aria-hidden="true" class="menu-icon" name="beanconqueror-cup" />
        <ion-label>{{"NAV_BREWS" | translate}}</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="statistics" href="/baristamode/statistics" tappable>
        <ion-icon aria-hidden="true" class="menu-icon" name="stats-chart-outline" />
        <ion-label>{{"NAV_STATISTICS" | translate}}</ion-label>
      </ion-tab-button>

    </ion-tab-bar>
    </nav>

  </ion-tabs>
</ion-content>
