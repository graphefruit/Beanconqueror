<ion-content>
  <ion-tabs>

    <!-- The href only makes Ionic's inner link focusable for keyboard users;
         Ionic cancels the link's default action and ion-tabs still navigates
         by the tab name. Ionic selects a tab on Enter/Space keyup, so the
         link's own click on Enter keydown is cancelled to select only once. -->
    <ion-tab-bar slot="bottom" (keydown.enter)="$event.preventDefault()">
      <ion-tab-button tab="dashboard" href="/home/dashboard" tappable>
        <ion-icon class="menu-icon" name="beanconqueror-home"></ion-icon>
        <ion-label>{{"NAV_HOME" | translate}}</ion-label>
      </ion-tab-button>
      <ion-tab-button tab="brews" href="/home/brews" tappable>
        <ion-icon class="menu-icon" name="beanconqueror-brew"></ion-icon>
        <ion-label>{{"NAV_BREWS" | translate}}</ion-label>
      </ion-tab-button>
      <ion-tab-button tab="beans" href="/home/beans" tappable>
        <ion-icon class="menu-icon" name="beanconqueror-bean"></ion-icon>
        <ion-label>{{"NAV_BEANS" | translate}}</ion-label>
        @if (!beansExist) {
<ion-badge color="danger"></ion-badge>
}
      </ion-tab-button>

      <ion-tab-button tab="preparations" href="/home/preparations" tappable>
        <ion-icon class="menu-icon" name="beanconqueror-preparation"></ion-icon>
        <ion-label>{{"NAV_PREPARATION" | translate}}</ion-label>
        @if (!preparationsExist) {
<ion-badge color="danger"></ion-badge>
}
      </ion-tab-button>

      <ion-tab-button tab="mills" href="/home/mills" tappable>
        <ion-icon class="menu-icon stroke" name="beanconqueror-pepper-mill"></ion-icon>
        <ion-label>{{"NAV_MILL" | translate}}</ion-label>
        @if (!millsExist) {
<ion-badge color="danger"></ion-badge>
}
      </ion-tab-button>


    </ion-tab-bar>
  </ion-tabs>
</ion-content>
