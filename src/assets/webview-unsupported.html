<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beanconqueror</title>
    <!--
      Shown by Capacitor on Android instead of the app (server.errorPath in capacitor.config.ts):
      when the system WebView is older than android.minWebViewVersion, or when the app page
      fails to load. Plain ES5 without the app bundle, so it also runs on old WebViews.
    -->
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        padding: 48px 24px;
        font-family: sans-serif;
        font-size: 16px;
        line-height: 1.5;
        background: #ead9c4;
        color: #211914;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #211914;
          color: #ead9c4;
        }
      }
      main {
        max-width: 480px;
        margin: 0 auto;
      }
      h1 {
        font-size: 22px;
        line-height: 1.3;
      }
      a {
        display: inline-block;
        margin-top: 8px;
        padding: 12px 20px;
        border-radius: 24px;
        background: #8b5e3c;
        color: #ffffff;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Beanconqueror could not be started</h1>
      <p id="text">Please try again. Your data stays on the device.</p>
      <a id="action" href="/">Try again</a>
    </main>
    <script>
      (function () {
        var MIN_WEBVIEW_VERSION = 119;
        var texts = {
          en: {
            outdatedTitle: 'Please update Android System WebView',
            outdatedText:
              'Beanconqueror needs Android System WebView (or Chrome) version {{min}} or later. ' +
              'This device has version {{version}}. Update it in the Google Play Store and ' +
              'restart Beanconqueror. Your data stays on the device.',
            outdatedAction: 'Open Google Play',
            failedTitle: 'Beanconqueror could not be started',
            failedText: 'Please try again. Your data stays on the device.',
            failedAction: 'Try again',
          },
          de: {
            outdatedTitle: 'Bitte Android System WebView aktualisieren',
            outdatedText:
              'Beanconqueror benötigt Android System WebView (oder Chrome) ab Version {{min}}. ' +
              'Auf diesem Gerät ist Version {{version}} installiert. Aktualisiere sie im ' +
              'Google Play Store und starte Beanconqueror neu. Deine Daten bleiben auf dem Gerät.',
            outdatedAction: 'Google Play öffnen',
            failedTitle: 'Beanconqueror konnte nicht gestartet werden',
            failedText:
              'Bitte versuche es erneut. Deine Daten bleiben auf dem Gerät.',
            failedAction: 'Erneut versuchen',
          },
        };
        var language = (navigator.language || 'en').slice(0, 2).toLowerCase();
        var t = texts[language] || texts.en;
        var match = /Chrome\/(\d+)/.exec(navigator.userAgent);
        var version = match ? parseInt(match[1], 10) : 0;
        var outdated = version > 0 && version < MIN_WEBVIEW_VERSION;
        var action = document.getElementById('action');

        document.documentElement.lang = texts[language] ? language : 'en';
        if (outdated) {
          document.getElementById('title').textContent = t.outdatedTitle;
          document.getElementById('text').textContent = t.outdatedText
            .replace('{{min}}', MIN_WEBVIEW_VERSION)
            .replace('{{version}}', version);
          action.textContent = t.outdatedAction;
          action.href =
            'https://play.google.com/store/apps/details?id=com.google.android.webview';
        } else {
          document.getElementById('title').textContent = t.failedTitle;
          document.getElementById('text').textContent = t.failedText;
          action.textContent = t.failedAction;
          action.href = '/';
        }
      })();
    </script>
  </body>
</html>
