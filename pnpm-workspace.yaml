# Delay new version of libraries for 10080 minutes (7 days) in an attempt to
# defend against increasingly common supply chain attacks on npm packages.
# See https://pnpm.io/settings#minimumreleaseage and
# https://pnpm.io/supply-chain-security
minimumReleaseAge: 10080

# Print an error for unreviewed build scripts
strictDepBuilds: true

# Allow the build scripts for the angular build dependencies listed here.
# Do NOT blindly add new dependencies here when an error pops up. Build scripts
# are a common supply chain attack vector for malware!
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true

patchedDependencies:
  # Keys code instrumented for coverage by its path too: git worktrees share the
  # build cache, and a cached file would otherwise report another checkout's path.
  '@angular/build@22.3.0': patches/@angular__build@22.3.0.patch
  # Settles the speech calls cut off by stop() on Android, as iOS does.
  '@capacitor-community/text-to-speech@8.0.2': patches/@capacitor-community__text-to-speech@8.0.2.patch
  # Imports UIKit in a header that compiled only through the CocoaPods prefix header.
  'skwas-cordova-plugin-datetimepicker@3.0.2': patches/skwas-cordova-plugin-datetimepicker@3.0.2.patch
